      - RABBITMQ_HOST=rabbitmq
      - TX_QUEUE=threshold_evaluation_3
      - AVG_QUEUE=calculated_averages_3
      - OUTPUT_QUEUE=threshold_transactions_3
  eof_tracker_r3:
    build:
      context: ./src/
      dockerfile: tracker/Dockerfile
    container_name: eof_tracker_r3
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - RABBITMQ_HOST=rabbitmq
      - EOF_CONTROL_QUEUE=eof_control_queue_3
      - FINAL_QUEUE=avg_transactions_3
      - TOPOLOGY=gateway,projection_dispatcher,currency_filter,avg_date_range_filter

networks:
  default:
    name: money_laundering_net