services:
  gateway:
    build:
      context: ./src/
      dockerfile: gateway/Dockerfile
    container_name: gateway
    environment:
      - INPUT_QUEUE=results_queue_2
      - MOM_HOST=rabbitmq
      - OUTPUT_QUEUE=transactions
      - PYTHONUNBUFFERED=1
      - SERVER_HOST=gateway
      - SERVER_PORT=5678
      - EOF_CONTROL_QUEUE=eof_control_queue_2

  client_1:
    build:
      context: ./src/
      dockerfile: client/Dockerfile
    container_name: client_1
    depends_on:
      - gateway
    environment:
      - INPUT_FILE=/datasets/HI-Small_Trans.csv
      - SERVER_HOST=gateway
      - SERVER_PORT=5678
      - OUTPUT_FILE_MINOR_RESULT=/output/client_1_minor_result.csv
      - OUTPUT_FILE_MAX_PER_BANK=/output/client_1_max_per_bank.csv
      - OUTPUT_FILE_LOWER_THAN_AVG=/output/client_1_lower_than_avg.csv
      - OUTPUT_FILE_SCATTER_GATHER=/output/client_1_scatter_gather.csv
      - OUTPUT_FILE_AMOUNT_ACCOUNTS=/output/client_1_amount_accounts.csv
    volumes:
      - ./datasets:/datasets
      - ./output:/output

  client_2:
    build:
      context: ./src/
      dockerfile: client/Dockerfile
    container_name: client_2
    depends_on:
      - gateway
    environment:
      - INPUT_FILE=/datasets/HI-Small_Trans.csv
      - SERVER_HOST=gateway
      - SERVER_PORT=5678
      - OUTPUT_FILE_MINOR_RESULT=/output/client_2_minor_result.csv
      - OUTPUT_FILE_MAX_PER_BANK=/output/client_2_max_per_bank.csv
      - OUTPUT_FILE_LOWER_THAN_AVG=/output/client_2_lower_than_avg.csv
      - OUTPUT_FILE_SCATTER_GATHER=/output/client_2_scatter_gather.csv
      - OUTPUT_FILE_AMOUNT_ACCOUNTS=/output/client_2_amount_accounts.csv
    volumes:
      - ./datasets:/datasets
      - ./output:/output

  projection_dispatcher_r2_1:
    build:
      context: ./src/
      dockerfile: workers/worker/Dockerfile
    container_name: projection_dispatcher_r2_1
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RULE_ID=2
      - NEXT_STAGE_ID=currency_filter
      - OPERATION_TYPE=projection_dispatcher
      - INPUT_MIDDLEWARE_TYPE=queue
      - INPUT_QUEUE=transactions
      - OUTPUTS=minor_query,max_query,avg_query,scatter_gather_query,count_query
      - EOF_CONTROL_QUEUE=eof_control_queue_2

  currency_filter_r2_1:
    build:
      context: ./src/
      dockerfile: workers/worker/Dockerfile
    container_name: currency_filter_r2_1
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RULE_ID=2
      - NEXT_STAGE_ID=bank_dispatcher
      - OPERATION_TYPE=currency_filter
      - INPUT_MIDDLEWARE_TYPE=queue
      - INPUT_QUEUE=max_query
      - OUTPUT_MIDDLEWARE_TYPE=queue
      - OUTPUTS=to_bank_dispatcher_queue_2
      - CURRENCY=US Dollar
      - EOF_CONTROL_QUEUE=eof_control_queue_2

  bank_dispatcher_r2_1:
    build:
      context: ./src/
      dockerfile: workers/worker/Dockerfile
    container_name: bank_dispatcher_r2_1
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RULE_ID=2
      - NEXT_STAGE_ID=local_bank_max_aggregator
      - OPERATION_TYPE=bank_dispatcher
      - INPUT_MIDDLEWARE_TYPE=queue
      - INPUT_QUEUE=to_bank_dispatcher_queue_2
      - OUTPUT_MIDDLEWARE_TYPE=none
      - OUTPUT_EXCHANGE=bank_shards_2
      - AGGREGATORS_COUNT=2
      - EOF_CONTROL_QUEUE=eof_control_queue_2

  local_bank_max_aggregator_r2_0:
    build:
      context: ./src/
      dockerfile: workers/worker/Dockerfile
    #entrypoint: ["python3", "-m", "operations.aggregators.local_bank_max_aggregator"]
    container_name: local_bank_max_aggregator_r2_0
    environment:
      - PYTHONUNBUFFERED=1
      - RABBITMQ_HOST=rabbitmq
      - OPERATION_TYPE=local_bank_max_aggregator
      - RULE_ID=2
      - OPERATION_TYPE=local_bank_max_aggregator
      - NEXT_STAGE_ID=bank_resolver
      - ID=0
      - INPUT_EXCHANGE=bank_shards_2
      - OUTPUT_EXCHANGE=max_bank_transactions
      - DISPATCHERS_AMOUNT=1
      - RESOLVERS_COUNT=1

  bank_resolver_r2_1:
    build:
      context: ./src/
      #dockerfile: workers/resolver/Dockerfile
      dockerfile: workers/worker/Dockerfile
    container_name: bank_resolver_r2_1
    environment:
      - PYTHONUNBUFFERED=1
      - RABBITMQ_HOST=rabbitmq
      - OPERATION_TYPE=bank_resolver
      - RULE_ID=2
      - OPERATION_TYPE=bank_resolver
      - ID=0
      - INPUT_EXCHANGE=max_bank_transactions
      - OUTPUT_QUEUE=results_queue_2
      - AGGREGATORS_COUNT=1

networks:
  default:
    name: money_laundering_net
    external: true