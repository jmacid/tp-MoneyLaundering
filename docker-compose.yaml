services:

  client_1:
    build:
      context: ./src/
      dockerfile: client/Dockerfile
    container_name: client_1
    depends_on:
      - gateway
    environment:
      - INPUT_FILE=/datasets/HI-Small_Trans.csv
      - SERVER_HOST=gateway
      - SERVER_PORT=5678
      - OUTPUT_FILE_MINOR_RESULT=/output/client_1_minor_result.csv
      - OUTPUT_FILE_SCATTER_GATHER=/output/client_1_scatter_gather.csv
    networks:
      - money_laundering_net
    volumes:
      - ./datasets:/datasets
      - ./output:/output

  gateway:
    build:
      context: ./src/
      dockerfile: gateway/Dockerfile
    container_name: gateway
    environment:
      - INPUT_QUEUE=scatter_gather_accounts_4
      - MOM_HOST=rabbitmq
      - OUTPUT_QUEUE=transactions
      - PYTHONUNBUFFERED=1
      - SERVER_HOST=gateway
      - SERVER_PORT=5678
      - EOF_CONTROL_QUEUE=eof_control_queue_4
    networks:
      - money_laundering_net

  projection_dispatcher_1:
    build:
      context: ./src/
      dockerfile: workers/worker/Dockerfile
    container_name: projection_dispatcher_1
    environment:
      - RABBITMQ_HOST=rabbitmq
      - NODE_ID=projection_dispatcher_1
      - RULE_ID=4
      - NEXT_STAGE_ID=currency_filter
      - OPERATION_TYPE=projection_dispatcher
      - INPUT_MIDDLEWARE_TYPE=queue
      - INPUT_QUEUE=transactions
      - OUTPUTS=minor_query,max_query,avg_query,scatter_gather_query,count_query
      - EOF_CONTROL_QUEUE=eof_control_queue_4
    networks:
      - money_laundering_net

  projection_dispatcher_2:
    build:
      context: ./src/
      dockerfile: workers/worker/Dockerfile
    container_name: projection_dispatcher_2
    environment:
      - RABBITMQ_HOST=rabbitmq
      - NODE_ID=projection_dispatcher_2
      - RULE_ID=4
      - NEXT_STAGE_ID=currency_filter
      - OPERATION_TYPE=projection_dispatcher
      - INPUT_MIDDLEWARE_TYPE=queue
      - INPUT_QUEUE=transactions
      - OUTPUTS=minor_query,max_query,avg_query,scatter_gather_query,count_query
      - EOF_CONTROL_QUEUE=eof_control_queue_4
    networks:
      - money_laundering_net

  currency_filter_r4_1:
    build:
      context: ./src/
      dockerfile: workers/worker/Dockerfile
    container_name: currency_filter_r4_1
    environment:
      - RABBITMQ_HOST=rabbitmq
      - NODE_ID=currency_filter_r4_1
      - RULE_ID=4
      - NEXT_STAGE_ID=date_range_filter
      - OPERATION_TYPE=currency_filter
      - INPUT_MIDDLEWARE_TYPE=queue
      - INPUT_QUEUE=scatter_gather_query
      - OUTPUT_MIDDLEWARE_TYPE=queue
      - OUTPUTS=USD_transactions_4
      - CURRENCY=US Dollar
      - EOF_CONTROL_QUEUE=eof_control_queue_4
    networks:
      - money_laundering_net

  currency_filter_r4_2:
    build:
      context: ./src/
      dockerfile: workers/worker/Dockerfile
    container_name: currency_filter_r4_2
    environment:
      - RABBITMQ_HOST=rabbitmq
      - NODE_ID=currency_filter_r4_2
      - RULE_ID=4
      - NEXT_STAGE_ID=date_range_filter
      - OPERATION_TYPE=currency_filter
      - INPUT_MIDDLEWARE_TYPE=queue
      - INPUT_QUEUE=scatter_gather_query
      - OUTPUT_MIDDLEWARE_TYPE=queue
      - OUTPUTS=USD_transactions_4
      - CURRENCY=US Dollar
      - EOF_CONTROL_QUEUE=eof_control_queue_4
    networks:
      - money_laundering_net

  date_range_filter_r4_1:
    build:
      context: ./src/
      dockerfile: workers/worker/Dockerfile
    container_name: date_range_filter_r4_1
    environment:
      - RABBITMQ_HOST=rabbitmq
      - NODE_ID=date_range_filter_r4_1
      - RULE_ID=4
      - NEXT_STAGE_ID=destination_filter
      - OPERATION_TYPE=date_range_filter
      - INPUT_MIDDLEWARE_TYPE=queue
      - INPUT_QUEUE=USD_transactions_4
      - OUTPUT_MIDDLEWARE_TYPE=sharding_exchange
      - OUTPUT_EXCHANGE=account_shards_4
      - SHARDS_COUNT=2
      - SHARDING_KEY_FIELD=from_account
      - START_DATE=2022-09-01T00:15:00
      - END_DATE=2022-09-01T00:30:00
      - EOF_CONTROL_QUEUE=eof_control_queue_4
    networks:
      - money_laundering_net

  date_range_filter_r4_2:
    build:
      context: ./src/
      dockerfile: workers/worker/Dockerfile
    container_name: date_range_filter_r4_2
    environment:
      - RABBITMQ_HOST=rabbitmq
      - NODE_ID=date_range_filter_r4_2
      - RULE_ID=4
      - NEXT_STAGE_ID=destination_filter
      - OPERATION_TYPE=date_range_filter
      - INPUT_MIDDLEWARE_TYPE=queue
      - INPUT_QUEUE=USD_transactions_4
      - OUTPUT_MIDDLEWARE_TYPE=sharding_exchange
      - OUTPUT_EXCHANGE=account_shards_4
      - SHARDS_COUNT=2
      - SHARDING_KEY_FIELD=from_account
      - START_DATE=2022-09-01T00:15:00
      - END_DATE=2022-09-01T00:30:00
      - EOF_CONTROL_QUEUE=eof_control_queue_4
    networks:
      - money_laundering_net

  destination_filter_r4_1:
    build:
      context: ./src/
      dockerfile: workers/worker/Dockerfile
    container_name: destination_filter_r4_1
    environment:
      - RABBITMQ_HOST=rabbitmq
      - NODE_ID=destination_filter_r4_1
      - RULE_ID=4
      - NEXT_STAGE_ID=scatter_gather_detector
      - OPERATION_TYPE=destination_filter
      - INPUT_MIDDLEWARE_TYPE=exchange
      - INPUT_EXCHANGE=account_shards_4
      - INPUT_ROUTING_KEYS=account_shards_4_0
      - OUTPUT_MIDDLEWARE_TYPE=queue
      - OUTPUTS=bridge_account_shards_4
      - DESTINATION_ACC_REQUIRED=3
      - EOF_CONTROL_QUEUE=eof_control_queue_4
    networks:
      - money_laundering_net

  destination_filter_r4_2:
    build:
      context: ./src/
      dockerfile: workers/worker/Dockerfile
    container_name: destination_filter_r4_2
    environment:
      - RABBITMQ_HOST=rabbitmq
      - NODE_ID=destination_filter_r4_2
      - RULE_ID=4
      - NEXT_STAGE_ID=scatter_gather_detector
      - OPERATION_TYPE=destination_filter
      - INPUT_MIDDLEWARE_TYPE=exchange
      - INPUT_EXCHANGE=account_shards_4
      - INPUT_ROUTING_KEYS=account_shards_4_1
      - OUTPUT_MIDDLEWARE_TYPE=queue
      - OUTPUTS=bridge_account_shards_4
      - DESTINATION_ACC_REQUIRED=3
      - EOF_CONTROL_QUEUE=eof_control_queue_4
    networks:
      - money_laundering_net

  scatter_gather_detector_r4_1:
    build:
      context: ./src/
      dockerfile: workers/worker/Dockerfile
    container_name: scatter_gather_detector_r4_1
    environment:
      - RABBITMQ_HOST=rabbitmq
      - NODE_ID=scatter_gather_detector_r4_1
      - RULE_ID=4
      - OPERATION_TYPE=scatter_gather_detector
      - INPUT_MIDDLEWARE_TYPE=queue
      - INPUT_QUEUE=bridge_account_shards_4
      - OUTPUT_MIDDLEWARE_TYPE=queue
      - OUTPUTS=scatter_gather_accounts_4
      - EOF_CONTROL_QUEUE=eof_control_queue_4
    networks:
      - money_laundering_net

networks:
  money_laundering_net:
    external: true
