    container_name: amount_filter_r1_1
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - RABBITMQ_HOST=rabbitmq
      - OPERATION_TYPE=amount_filter
      - INPUT_MIDDLEWARE_TYPE=queue
      - INPUT_QUEUE=range_transactions
      - OUTPUT_MIDDLEWARE_TYPE=queue
      - OUTPUTS=minor_transactions
      - MINIMUM_AMOUNT=50
      - EOF_CONTROL_QUEUE=eof_control_queue_1
  amount_filter_r1_2:
    build:
      context: ./src/
      dockerfile: workers/worker/Dockerfile
    container_name: amount_filter_r1_2
    depends_on:
