      - INPUT_QUEUE=transactions
      - OUTPUTS=minor_query,max_query,avg_query,scatter_gather_query,count_query
      - EOF_CONTROL_QUEUE=eof_control_queue_1,eof_control_queue_2,eof_control_queue_3,eof_control_queue_4,eof_control_queue_5
  projection_dispatcher_3:
    build:
      context: ./src/
      dockerfile: workers/worker/Dockerfile
    container_name: projection_dispatcher_3
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
