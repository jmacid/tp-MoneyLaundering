services:
  gateway:
    build:
      context: ./src/
      dockerfile: gateway/Dockerfile
    container_name: gateway
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - INPUT_QUEUE=minor_transactions,results_queue_2
    - MOM_HOST=rabbitmq
    - OUTPUT_QUEUE=transactions
    - PYTHONUNBUFFERED=1
    - SERVER_HOST=gateway
    - SERVER_PORT=5678
    - EOF_CONTROL_QUEUE=eof_control_queue_1,eof_control_queue_2
    - EOFS_EXPECTED=2
  rabbitmq:
    build:
      context: ./src/rabbitmq
      dockerfile: Dockerfile
    container_name: rabbitmq
    environment:
    - RABBITMQ_LOG_LEVELS=error
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 50s
      test: rabbitmq-diagnostics check_port_connectivity
      timeout: 3s
    ports:
    - 5672:5672
    - 15672:15672
  projection_dispatcher_1:
    build:
      context: ./src/
      dockerfile: workers/worker/Dockerfile
    container_name: projection_dispatcher_1
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - RABBITMQ_HOST=rabbitmq
      - OPERATION_TYPE=projection_dispatcher
      - INPUT_MIDDLEWARE_TYPE=queue
      - INPUT_QUEUE=transactions
      - OUTPUTS=minor_query,max_query,avg_query,scatter_gather_query,count_query
      - EOF_CONTROL_QUEUE=eof_control_queue_1,eof_control_queue_2
  projection_dispatcher_2:
    build:
      context: ./src/
      dockerfile: workers/worker/Dockerfile
    container_name: projection_dispatcher_2
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - RABBITMQ_HOST=rabbitmq
      - OPERATION_TYPE=projection_dispatcher
      - INPUT_MIDDLEWARE_TYPE=queue
      - INPUT_QUEUE=transactions
      - OUTPUTS=minor_query,max_query,avg_query,scatter_gather_query,count_query
      - EOF_CONTROL_QUEUE=eof_control_queue_1,eof_control_queue_2
  projection_dispatcher_3:
    build:
      context: ./src/
      dockerfile: workers/worker/Dockerfile
    container_name: projection_dispatcher_3
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - RABBITMQ_HOST=rabbitmq
      - OPERATION_TYPE=projection_dispatcher
      - INPUT_MIDDLEWARE_TYPE=queue
      - INPUT_QUEUE=transactions
      - OUTPUTS=minor_query,max_query,avg_query,scatter_gather_query,count_query
      - EOF_CONTROL_QUEUE=eof_control_queue_1,eof_control_queue_2
  # Rule 1
  currency_filter_r1_1:
    build:
      context: ./src/
      dockerfile: workers/worker/Dockerfile
    container_name: currency_filter_r1_1
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - RABBITMQ_HOST=rabbitmq
      - OPERATION_TYPE=currency_filter
      - INPUT_MIDDLEWARE_TYPE=queue
      - INPUT_QUEUE=minor_query
      - OUTPUT_MIDDLEWARE_TYPE=queue
      - OUTPUTS=USD_transactions
      - CURRENCY=US Dollar
      - EOF_CONTROL_QUEUE=eof_control_queue_1
  currency_filter_r1_2:
    build:
      context: ./src/
      dockerfile: workers/worker/Dockerfile
    container_name: currency_filter_r1_2
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - RABBITMQ_HOST=rabbitmq
      - OPERATION_TYPE=currency_filter
      - INPUT_MIDDLEWARE_TYPE=queue
      - INPUT_QUEUE=minor_query
      - OUTPUT_MIDDLEWARE_TYPE=queue
      - OUTPUTS=USD_transactions
      - CURRENCY=US Dollar
      - EOF_CONTROL_QUEUE=eof_control_queue_1
  currency_filter_r1_3:
    build:
      context: ./src/
      dockerfile: workers/worker/Dockerfile
    container_name: currency_filter_r1_3
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - RABBITMQ_HOST=rabbitmq
      - OPERATION_TYPE=currency_filter
      - INPUT_MIDDLEWARE_TYPE=queue
      - INPUT_QUEUE=minor_query
      - OUTPUT_MIDDLEWARE_TYPE=queue
      - OUTPUTS=USD_transactions
      - CURRENCY=US Dollar
      - EOF_CONTROL_QUEUE=eof_control_queue_1
  date_range_filter_r1_1:
    build:
      context: ./src/
      dockerfile: workers/worker/Dockerfile
    container_name: date_range_filter_r1_1
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - RABBITMQ_HOST=rabbitmq
      - OPERATION_TYPE=date_range_filter
      - INPUT_MIDDLEWARE_TYPE=queue
      - INPUT_QUEUE=USD_transactions
      - OUTPUT_MIDDLEWARE_TYPE=queue
      - OUTPUTS=range_transactions
      - START_DATE=2022-09-01T00:15:00
      - END_DATE=2022-09-01T00:30:00
      - EOF_CONTROL_QUEUE=eof_control_queue_1
  date_range_filter_r1_2:
    build:
      context: ./src/
      dockerfile: workers/worker/Dockerfile
    container_name: date_range_filter_r1_2
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - RABBITMQ_HOST=rabbitmq
      - OPERATION_TYPE=date_range_filter
      - INPUT_MIDDLEWARE_TYPE=queue
      - INPUT_QUEUE=USD_transactions
      - OUTPUT_MIDDLEWARE_TYPE=queue
      - OUTPUTS=range_transactions
      - START_DATE=2022-09-01T00:15:00
      - END_DATE=2022-09-01T00:30:00
      - EOF_CONTROL_QUEUE=eof_control_queue_1
  date_range_filter_r1_3:
    build:
      context: ./src/
      dockerfile: workers/worker/Dockerfile
    container_name: date_range_filter_r1_3
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - RABBITMQ_HOST=rabbitmq
      - OPERATION_TYPE=date_range_filter
      - INPUT_MIDDLEWARE_TYPE=queue
      - INPUT_QUEUE=USD_transactions
      - OUTPUT_MIDDLEWARE_TYPE=queue
      - OUTPUTS=range_transactions
      - START_DATE=2022-09-01T00:15:00
      - END_DATE=2022-09-01T00:30:00
      - EOF_CONTROL_QUEUE=eof_control_queue_1
  amount_filter_r1_1:
    build:
      context: ./src/
      dockerfile: workers/worker/Dockerfile
    container_name: amount_filter_r1_1
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - RABBITMQ_HOST=rabbitmq
      - OPERATION_TYPE=amount_filter
      - INPUT_MIDDLEWARE_TYPE=queue
      - INPUT_QUEUE=range_transactions
      - OUTPUT_MIDDLEWARE_TYPE=queue
      - OUTPUTS=minor_transactions
      - MINIMUM_AMOUNT=50
      - EOF_CONTROL_QUEUE=eof_control_queue_1
  amount_filter_r1_2:
    build:
      context: ./src/
      dockerfile: workers/worker/Dockerfile
    container_name: amount_filter_r1_2
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - RABBITMQ_HOST=rabbitmq
      - OPERATION_TYPE=amount_filter
      - INPUT_MIDDLEWARE_TYPE=queue
      - INPUT_QUEUE=range_transactions
      - OUTPUT_MIDDLEWARE_TYPE=queue
      - OUTPUTS=minor_transactions
      - MINIMUM_AMOUNT=50
      - EOF_CONTROL_QUEUE=eof_control_queue_1
  amount_filter_r1_3:
    build:
      context: ./src/
      dockerfile: workers/worker/Dockerfile
    container_name: amount_filter_r1_3
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - RABBITMQ_HOST=rabbitmq
      - OPERATION_TYPE=amount_filter
      - INPUT_MIDDLEWARE_TYPE=queue
      - INPUT_QUEUE=range_transactions
      - OUTPUT_MIDDLEWARE_TYPE=queue
      - OUTPUTS=minor_transactions
      - MINIMUM_AMOUNT=50
      - EOF_CONTROL_QUEUE=eof_control_queue_1
  eof_tracker_r1:
    build:
      context: ./src/
      dockerfile: tracker/Dockerfile
    container_name: eof_tracker_r1
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - EOF_CONTROL_QUEUE=eof_control_queue_1
      - RABBITMQ_HOST=rabbitmq
      - TOPOLOGY=gateway,projection_dispatcher,currency_filter,date_range_filter,amount_filter
  # Rule 2
  currency_filter_r2_1:
    build:
      context: ./src/
      dockerfile: workers/worker/Dockerfile
    container_name: currency_filter_r2_1
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - RABBITMQ_HOST=rabbitmq
      - OPERATION_TYPE=currency_filter
      - INPUT_MIDDLEWARE_TYPE=queue
      - INPUT_QUEUE=max_query
      - OUTPUT_MIDDLEWARE_TYPE=queue
      - OUTPUTS=to_bank_dispatcher_queue_2
      - CURRENCY=US Dollar
      - EOF_CONTROL_QUEUE=eof_control_queue_2
  bank_dispatcher_r2_1:
    build:
      context: ./src
      dockerfile: workers/worker/Dockerfile
    container_name: bank_dispatcher_r2_1
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - RABBITMQ_HOST=rabbitmq
      - OPERATION_TYPE=bank_dispatcher
      - OUTPUT_MIDDLEWARE_TYPE=none
      - INPUT_MIDDLEWARE_TYPE=queue
      - INPUT_QUEUE=to_bank_dispatcher_queue_2
      - OUTPUT_EXCHANGE=bank_shards_2
      - AGGREGATORS_COUNT=2
      - EOF_CONTROL_QUEUE=eof_control_queue_2
  local_bank_max_aggregator_r2_0:
    build:
      context: ./src
      dockerfile: workers/worker/Dockerfile
    entrypoint: ["python3", "-m", "operations.aggregators.local_bank_max_aggregator"]
    container_name: local_bank_max_aggregator_r2_0
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - RABBITMQ_HOST=rabbitmq
      - ID=0
      - INPUT_EXCHANGE=bank_shards_2
      - OUTPUT_EXCHANGE=max_bank_transactions
      - DISPATCHERS_AMOUNT=1
      - RESOLVERS_COUNT=1
  bank_resolver_r2_1:
    build:
      context: ./src/
      dockerfile: workers/resolver/Dockerfile
    container_name: bank_resolver_r2_1
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - RABBITMQ_HOST=rabbitmq
      - ID=0
      - INPUT_EXCHANGE=max_bank_transactions
      - OUTPUT_QUEUE=results_queue_2
      - AGGREGATORS_COUNT=1
  eof_tracker_r2:
    build:
      context: ./src/
      dockerfile: tracker/Dockerfile
    container_name: eof_tracker_r2
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - RABBITMQ_HOST=rabbitmq
      - EOF_CONTROL_QUEUE=eof_control_queue_2
      - FINAL_QUEUE=to_bank_dispatcher_queue_2
      - TOPOLOGY=gateway,projection_dispatcher,currency_filter


networks:
  default:
    name: money_laundering_net