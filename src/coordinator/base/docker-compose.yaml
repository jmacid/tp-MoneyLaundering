services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 10

  coordinator:
    build:
      context: ../..
      dockerfile: coordinator/base/Dockerfile
    container_name: coordinator
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      PYTHONPATH: /app
      RABBITMQ_HOST: rabbitmq
      COORDINATOR_QUEUE: coordinator_control_queue
      REPORT_RETRY_SECONDS: 5
      NODE_TIMEOUT_SECONDS: 9999
      MONITOR_INTERVAL_SECONDS: 9999
      STATE_DB_PATH: /app/data/state.db
      COORDINATOR_ID: 1
    volumes:
      - coordinator_data:/app/data
    restart: unless-stopped
  coordinator_2:
    build:
      context: ../..
      dockerfile: coordinator/base/Dockerfile
    container_name: coordinator_2
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      PYTHONPATH: /app
      RABBITMQ_HOST: rabbitmq
      COORDINATOR_QUEUE: coordinator_control_queue
      REPORT_RETRY_SECONDS: 5
      NODE_TIMEOUT_SECONDS: 9999
      MONITOR_INTERVAL_SECONDS: 9999
      STATE_DB_PATH: /app/data/state.db
      COORDINATOR_ID: 2
    volumes:
      - coordinator_data:/app/data
    restart: unless-stopped

volumes:
  coordinator_data: